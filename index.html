<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="_DOnusMrksO9BTGOKfWH-kbKPW59jj_Vzu57qxwcHlI" />
    <title>HK Event & Decoration | Jaipur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #b03060; --purple: #6a1b9a; --bg: #ffffff; }
        body { margin:0; font-family:'Poppins', sans-serif; background: #fff; color: #333; padding-bottom: 80px; }
        
        /* Header & Search Bar */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: white; }
        .logo-text { font-weight: bold; color: var(--primary); font-size: 20px; }
        .loc-badge { font-size: 11px; background: #f0f0f0; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        .search-area { padding: 0 20px 20px; }
        .search-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9; outline: none; box-sizing: border-box; }

        /* Auto-Slide Banner */
        .banner-container { width: 92%; margin: 0 auto; height: 190px; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .slider { display: flex; transition: 0.5s ease-in-out; height: 100%; }
        .slide { min-width: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Circular Categories (Swipeable) */
        .section-title { padding: 25px 20px 10px; font-size: 17px; font-weight: 600; }
        .cat-scroll { display: flex; overflow-x: auto; gap: 18px; padding: 0 20px; scrollbar-width: none; }
        .cat-item { min-width: 70px; text-align: center; }
        .cat-circle { width: 62px; height: 62px; background: #fff1f6; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border: 1px solid #ffeef4; }
        .cat-circle span { font-size: 26px; }
        .cat-label { font-size: 10px; font-weight: 600; color: #555; }

        /* Original Gallery Grid (Tumhari Photos) */
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .work-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .work-card img { width: 100%; height: 150px; object-fit: cover; background: #f4f4f4; }
        .card-footer { padding: 10px; }
        .btn-enq { width: 100%; background: var(--purple); color: white; border: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

        /* Floating Business Buttons */
        .action-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; z-index: 1001; }
        .act-btn { flex: 1; padding: 16px; text-decoration: none; font-weight: bold; font-size: 14px; text-align: center; }
        .act-wa { background: #25d366; color: white; }
        .act-call { color: #333; border-right: 1px solid #eee; }

        footer { padding: 40px 20px; text-align: center; background: #f9f9f9; font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-text">HK EVENTS</div>
    <div class="loc-badge">📍 JAIPUR</div>
</div>

<div class="search-area">
    <input type="text" class="search-input" placeholder="Search for Wedding, Birthday...">
</div>

<div class="banner-container">
    <div class="slider" id="mainSlider">
        <div class="slide"><img src="1000108998.jpg"></div>
        <div class="slide"><img src="1000108997.jpg"></div>
        <div class="slide"><img src="1000108996.jpg"></div>
    </div>
</div>

<div class="section-title">What are you celebrating?</div>
<div class="cat-scroll">
    <div class="cat-item"><div class="cat-circle"><span>💍</span></div><div class="cat-label">Wedding</div></div>
    <div class="cat-item"><div class="cat-circle"><span>🎂</span></div><div class="cat-label">Birthday</div></div>
    <div class="cat-item"><div class="cat-circle"><span>✨</span></div><div class="cat-label">Anniversary</div></div>
    <div class="cat-item"><div class="cat-circle"><span>🎁</span></div><div class="cat-label">Surprise</div></div>
    <div class="cat-item"><div class="cat-circle"><span>🕯️</span></div><div class="cat-label">Dinner</div></div>
</div>

<div class="section-title">Our Real Work Gallery</div>
<div class="gallery-grid">
    <div class="work-card"><img src="1000108995.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
    <div class="work-card"><img src="1000108994.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
    <div class="work-card"><img src="1000108993.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
    <div class="work-card"><img src="1000108992.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
    <div class="work-card"><img src="1000108990.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
    <div class="work-card"><img src="1000108989.jpg"><div class="card-footer"><button class="btn-enq" onclick="location.href='https://wa.me/919782469834'">Enquiry Now</button></div></div>
</div>

<footer>
    <p><b>HK Event & Decoration</b><br>125, Hathroi Bawdi, Jaipur</p>
    <p>© 2026 | Quality Events by Jatin</p>
</footer>

<div class="action-bar">
    <a href="tel:9782469834" class="act-btn act-call">📞 Call Now</a>
    <a href="https://wa.me/919782469834" class="act-btn act-wa">💬 Get Quote</a>
</div>

<script>
    let current = 0;
    const slider = document.getElementById('mainSlider');
    setInterval(() => {
        current = (current + 1) % 3;
        slider.style.transform = `translateX(-${current * 100}%)`;
    }, 3000);
</script>

</body>
</html>
